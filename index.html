<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CineList</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CineList" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!--
      Apply the saved theme before anything paints.

      This has to be a plain inline script, not the module bundle: a module script is
      deferred and runs after first paint, which is exactly when the wrong-colour flash
      would happen. The storage key is mirrored in src/composables/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cinelist:theme');
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('ion-palette-dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          // Covers the gap between parsing the HTML and applying the stylesheet, which
          // would otherwise paint the browser default white.
          root.style.backgroundColor = dark ? '#0B0B0B' : '#F6F7F9';
        } catch (e) {
          /* localStorage can throw in some WebView privacy modes. */
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
